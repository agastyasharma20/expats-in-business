# Optional: runs on the GitHub mirror, including the full Playwright suite.
name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check-and-e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: eib
          POSTGRES_PASSWORD: eib_local_only
          POSTGRES_DB: eib
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eib" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eib:eib_local_only@localhost:5432/eib
      DEMO_MODE: "true"
      AI_PROVIDER: demo
      BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npx prisma migrate deploy && npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
