# Pings the sandbox every 10 minutes so Render's free instance (which sleeps after 15 idle minutes)
# stays awake. Scheduled workflows run from the default branch only. GitHub may delay a run by a few
# minutes and pauses schedules on a repository with no activity for 60 days.
name: Keep sandbox awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Set the repository variable SANDBOX_URL to change the target; otherwise the sandbox below.
      TARGET: ${{ vars.SANDBOX_URL || 'https://eib-sandbox.onrender.com' }}
    steps:
      - name: Ping the health endpoint
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 20 \
            --retry-all-errors "$TARGET/api/health"
