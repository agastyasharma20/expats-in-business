services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: eib
      POSTGRES_PASSWORD: eib_local_only
      POSTGRES_DB: eib
    # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
    ports: ["5433:5432"]
    volumes: ["eib_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eib"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  eib_db:
